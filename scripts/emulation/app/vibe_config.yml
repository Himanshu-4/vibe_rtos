# vibe_config.yml — VibeRTOS application configuration for the QEMU
# emulation test app. Parsed by cmake/modules/yaml_config.cmake.

board: mps2_an386

kernel:
  tick_hz: 1000
  heap_size: 8192
  smp: false

subsys:
  shell: false
  logging:
    enabled: true
    level: inf
    backend: uart

drivers:
  uart: true
  gpio: false
